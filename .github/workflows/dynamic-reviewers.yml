name: Dynamic PR Reviewers

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  request-reviewers:
    name: Request Dynamic Reviewers
    runs-on: ubuntu-latest

    steps:
      - name: Get changed files
        id: changed-files
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100
              }
            );

            const yamlFiles = files
              .map(file => file.filename)
              .filter(file =>
                file.endsWith(".yml") ||
                file.endsWith(".yaml")
              );

            console.log("Changed YAML files:");

            for (const file of yamlFiles) {
              console.log(`- ${file}`);
            }

            core.setOutput(
              "files",
              JSON.stringify(yamlFiles)
            );

      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Install PyYAML
        run: |
          pip install pyyaml

      - name: Find reviewers
        id: reviewers
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          python - <<'PY'
          import json
          import os
          import yaml

          changed_files = json.loads(
              os.environ["CHANGED_FILES"]
          )

          teams = set()

          print("Processing changed YAML files...")

          for file in changed_files:
              print(f"\nChecking: {file}")

              if not os.path.exists(file):
                  print("  File does not exist in base branch. Skipping.")
                  continue

              with open(file, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f) or {}

              reviewer = data.get("reviewer", {})

              if isinstance(reviewer, dict):
                  team = reviewer.get("team")

                  if team:
                      team = str(team).strip()

                      if team:
                          print(f"  Reviewer team: {team}")
                          teams.add(team)

          teams = sorted(teams)

          print("\n==============================")
          print("Required reviewer teams")
          print("==============================")

          if teams:
              for team in teams:
                  print(f"- {team}")
          else:
              print("No reviewer teams found.")

          print("==============================")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(
                  f"teams={json.dumps(teams)}\n"
              )
          PY

      - name: Request team reviewers
        if: steps.reviewers.outputs.teams != '[]'
        uses: actions/github-script@v8
        env:
          TEAMS: ${{ steps.reviewers.outputs.teams }}
        with:
          github-token: ${{ secrets.DYNAMIC_REVIEWER_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const teams = JSON.parse(process.env.TEAMS);

            console.log(`Requesting reviewer teams:`);

            for (const team of teams) {
              console.log(`- ${team}`);
            }

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number,
              team_reviewers: teams
            });

            console.log("Reviewer request completed successfully.");
